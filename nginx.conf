server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /internal/ {
    proxy_pass http://backend-api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Authorization $http_authorization;
  }

  # Self-hosted OCR runtime: Tesseract's worker, WASM cores and English trained
  # data. Declared ahead of the SPA fallback on purpose — without it a missing
  # asset falls through to index.html and returns HTTP 200 with a page of HTML,
  # which Tesseract then tries to parse as WASM or trained data and fails in a
  # way that looks nothing like the missing file it is. A 404 says what is wrong.
  #
  # The files are versioned with the deployment and never edited in place, so
  # they cache for a year. eng.traineddata.gz is ~3 MB and the core ~4 MB, and
  # re-fetching those on every scan is the difference between a warm reader and
  # a slow one.
  # `^~` so this wins over the extension regex below: without it a request for
  # a .js core file would match the regex instead, and only the trained data
  # would land here — two rules governing one directory for no reason.
  location ^~ /tesseract/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
