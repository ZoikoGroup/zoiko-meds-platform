name: Production Release (backend + frontend)

on:
  # Gated on CI rather than on the push itself. Both deploys used to trigger
  # straight from `push: main`, which meant they raced CI instead of following
  # it: a merge whose tests failed still deployed, because nothing connected the
  # two runs. `workflow_run` fires only after CI has finished, and the jobs below
  # refuse to start unless it finished green.
  #
  # There is deliberately no paths filter and no substitute for one. An earlier
  # attempt reproduced `paths:` by diffing HEAD_SHA^..HEAD_SHA, which is wrong
  # for any push that lands more than one commit -- a direct multi-commit push
  # or a rebase merge -- because it sees only the final commit. A push of
  # "commit A: backend change" + "commit B: README" skipped the backend deploy
  # entirely. That made it strictly weaker than the native `paths:` filter it
  # replaced, which GitHub evaluates across every commit in the push.
  # `workflow_run` cannot carry `paths:` at all, and the only correct
  # alternative -- asking the API which commit was last deployed -- is more
  # moving parts than an occasional redundant restart is worth. So every green
  # CI on main releases the whole platform, including for a README-only change.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Manual release path, for a VM that was unreachable when the automatic run
  # fired. It takes an explicit commit and will not accept "whatever main is
  # now": an empty SHA fails rather than quietly becoming origin/main.
  #
  # NOTE: a manual run is NOT CI-gated. It releases the SHA given to it whether
  # or not CI ever passed on that commit. Both deploy scripts still refuse any
  # commit that is not reachable from origin/main, so the blast radius is
  # "something that is on main", not "anything at all". Requiring a reviewer on
  # top of that needs a GitHub Environment, which is repository configuration
  # rather than workflow code -- see the audit report.
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Full 40-character commit SHA to release (must be on main). NOT CI-gated."
        required: true
        type: string

# The release reaches the VM over SSH and needs nothing from the GitHub API.
permissions:
  contents: read

# ONE group around the COMPLETE release -- backend and frontend together.
#
# This used to be two separate workflows sharing a group, which quietly produced
# mixed releases. GitHub allows one run in progress and one pending per group,
# and queueing a new run CANCELS whatever was already pending. So:
#
#     backend(A) running, frontend(A) pending
#     backend(B) queues  -> frontend(A) cancelled
#     frontend(B) queues -> backend(B)  cancelled
#     => production ends up running backend A with frontend B
#
# Nothing in that sequence is a failure; every run is green. The fix is not a
# different concurrency setting -- GitHub supports only `group` and
# `cancel-in-progress`, with no queue-depth option -- but making the unit of
# concurrency the release rather than the component. Backend and frontend are
# now jobs inside one run, so they cannot be cancelled independently of one
# another, and a pending release can only ever be replaced as a whole.
#
# cancel-in-progress is false on purpose: a release interrupted between
# `prisma migrate deploy` and the restart leaves a migrated database with the
# old build still serving. Queue behind it instead.
#
# Concurrency protects the shared /var/www/zoiko-meds-platform working tree and
# the all-or-nothing shape of a release. It is NOT what makes the deployed
# commit correct -- queueing actually gives main more time to advance while a
# run waits. Exact-SHA pinning below is what guarantees that.
concurrency:
  group: production-release
  cancel-in-progress: false

# The one commit this entire release is authorised to deploy, and the only thing
# that decides what production ends up running. Set once here so the backend and
# frontend jobs cannot possibly resolve different values.
#
# Passed into the remote shell as an environment variable rather than
# interpolated into any `run:` or `script:` body on purpose: deploy_sha is
# operator input, and ${{ }} interpolation happens while the script is being
# assembled, before any validation step could reject it. As an env var it is a
# value, never a fragment of shell source.
env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.deploy_sha }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # A green CI on a push to main, or a deliberate manual run. Anything else --
    # a failed run, a cancelled run, a CI run from a pull request (including one
    # from a fork), a push to any other branch -- stops here. The frontend job
    # needs this one, so a skip here skips the whole release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'CI' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Check the authorised commit
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SHA:-}" ]; then
            echo "::error::No deploy SHA. A workflow_run must carry head_sha and a" >&2
            echo "manual run must be given deploy_sha. Refusing to deploy origin/main." >&2
            exit 1
          fi

          # Full 40 hex. The deploy script re-checks this and also proves the
          # commit exists and is on main; this is the early, cheap rejection.
          case "$DEPLOY_SHA" in
            *[!0-9a-fA-F]* | "")
              echo "::error::deploy SHA is not hexadecimal -- refusing." >&2; exit 1 ;;
          esac
          if [ "${#DEPLOY_SHA}" -ne 40 ]; then
            echo "::error::deploy SHA must be the full 40 characters (got ${#DEPLOY_SHA})." >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: deploying $DEPLOY_SHA. This path is NOT CI-gated."
          else
            echo "CI run ${{ github.event.workflow_run.id }} passed on $DEPLOY_SHA; deploying that commit."
          fi
      # The VM runs Node under pm2/systemd, not docker compose. This calls the
      # committed deploy script so the CI path and a manual run on the box do
      # exactly the same thing (install -> generate -> migrate -> build ->
      # restart -> health check) instead of drifting apart.
      #
      # NOTE: every run of this workflow failed between 2026-07-29 and 2026-08-17 —
      # first "ssh: handshake failed: unable to authenticate", then
      # "dial tcp ***:22: i/o timeout" — which is why the API served a build from
      # before 2026-08-07 while main moved on. GitHub-hosted runners connect from
      # rotating public IPs, so a firewall rule that allows a fixed office IP will
      # still drop them.
      #
      # If it regresses, the durable fix is an IAP tunnel rather than widening the
      # firewall: authenticate with google-github-actions/auth (Workload Identity
      # Federation, no long-lived key), then reach the VM with
      #     gcloud compute ssh "$INSTANCE" --zone "$ZONE" --tunnel-through-iap \
      #       --command "bash /var/www/zoiko-meds-platform/backend/scripts/deploy.sh $DEPLOY_SHA"
      # which needs only ingress from Google's IAP range 35.235.240.0/20 on tcp:22
      # — narrower than an office CIDR, and never 0.0.0.0/0. Allowing GitHub's own
      # ranges (https://api.github.com/meta) on tcp:22 also works, but is wider.
      #
      # A manual release from the VM is always available as a fallback:
      #     bash /var/www/zoiko-meds-platform/backend/scripts/deploy.sh <COMMIT_SHA>
      #
      # The SHA is mandatory there too: the script deploys the commit it is
      # given and refuses to guess at origin/main.
      #
      # The migration ledger is printed before and after the deploy, because this
      # log is the only view of the database for anyone without VM access. On
      # 2026-08-17 the API served code whose migration had never been applied:
      # every SavedMedicine query failed while the workflow was green, and nothing
      # in the pipeline output would have shown why. `migrate status` also names
      # the datasource host it is talking to, which is what catches migrations
      # being applied to a different database than the API reads.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          # Carries DEPLOY_SHA into the remote shell as a value. If this ever
          # failed to arrive, the deploy script's mandatory-SHA check fails the
          # release -- it never falls back to origin/main.
          envs: DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/zoiko-meds-platform/backend

            echo "::group::Migration ledger before deploy (host)"
            npx prisma migrate status || true
            echo "::endgroup::"

            # The API runs in a container whose DATABASE_URL may differ from the
            # host's .env. Never fatal: the service name is not guaranteed here.
            echo "::group::Migration ledger before deploy (API container)"
            docker compose exec -T api npx prisma migrate status 2>/dev/null || \
              echo "(could not reach the API container; skipping)"
            echo "::endgroup::"

            bash /var/www/zoiko-meds-platform/backend/scripts/deploy.sh "$DEPLOY_SHA"

            echo "::group::Migration ledger after deploy"
            npx prisma migrate status || true
            echo "::endgroup::"

      # A green tick must mean the new code is actually serving. Without this the
      # workflow could pass while the API still ran the previous build — which is
      # how the drift went unnoticed for eleven days.
      - name: Verify the release is live
        run: |
          set -e
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              -H 'Content-Type: application/json' -d '{}' \
              https://get.zoikomeds.com/api/pharmacies/me || echo 000)
            # 401 = route present and guarded. 404 = still the old build.
            if [ "$code" = "401" ]; then
              echo "PATCH /api/pharmacies/me -> 401: new build is live."
              exit 0
            fi
            echo "attempt $i: got $code, waiting..."
            sleep 5
          done
          echo "Release did not become live: PATCH /api/pharmacies/me never returned 401." >&2
          exit 1

      # Code live is not config live. PR #115 shipped the app-origin CORS
      # support, the deploy still failed to make the Android app work, and
      # nothing in the pipeline noticed: MOBILE_APP_ORIGINS was set in
      # docker-compose.prod.yml but the VM's API was restarted from an env that
      # never carried it, so the app got no Access-Control-Allow-Origin on any
      # request. This asks the running API exactly what the app will ask it, so
      # a missing env var fails the release instead of the tester's sign-in.
      - name: Verify the app origin is allowed by CORS
        run: |
          set -e
          echo "Probing with the Capacitor WebView origin (https://localhost)..."
          headers=$(curl -s -D - -o /dev/null \
            -H 'Origin: https://localhost' \
            https://get.zoikomeds.com/api/health)
          echo "$headers" | grep -i '^HTTP/'
          if echo "$headers" | grep -qi '^access-control-allow-origin: https://localhost'; then
            echo "App origin allowed: MOBILE_APP_ORIGINS is live."
          else
            echo "The API does NOT answer with Access-Control-Allow-Origin for https://localhost." >&2
            echo "Every request from the Android app will be blocked by the browser." >&2
            echo "Fix: add these to the VM's backend .env (pm2/systemd hosts read it via --update-env)" >&2
            echo "  MOBILE_APP_ORIGINS=https://localhost" >&2
            echo "  MOBILE_OAUTH_REDIRECT=com.zoikomeds.app://auth/callback" >&2
            echo "then restart the API (pm2 restart zoikomeds-api --update-env / systemctl restart)." >&2
            exit 1
          fi

      # The release being live says nothing about the database it is live
      # against. This is the check that would have caught 2026-08-17: the code
      # was current, the workflow was green, and every SavedMedicine query
      # failed because its migration had never been applied. The API reports its
      # own ledger, so this sees the database the API actually reads — not the
      # one whichever shell ran `migrate deploy` happened to be pointed at.
      - name: Verify the served schema is up to date
        run: |
          set -e
          body=$(curl -fsS https://get.zoikomeds.com/api/health/schema)
          echo "$body"
          case "$body" in
            *'"status":"ok"'*) echo "Schema is up to date." ;;
            *)
              echo "The deployed API is running against a schema that is not up to date." >&2
              echo "The 'detail' field above says what will reconcile it:" >&2
              echo "  behind - migrations went to a different database than the API reads;" >&2
              echo "           compare the datasource above with the VM's DATABASE_URL." >&2
              echo "  drift  - the ledger is complete but the tables are not, which is what" >&2
              echo "           'migrate resolve --applied' leaves behind. 'migrate deploy'" >&2
              echo "           will report nothing to do; reconcile with 'migrate diff'." >&2
              exit 1
              ;;
          esac

  # Second half of the same release, never a release of its own.
  #
  # `needs: backend` is what makes a backend failure stop the frontend: if the
  # backend deploy or any of its three post-deploy verifications fails, this job
  # is skipped and the workflow goes red. It also inherits the backend job's
  # `if:` -- a skipped backend skips this too -- so the CI gate is enforced once
  # and applies to the whole release.
  #
  # It deploys the SAME DEPLOY_SHA from the workflow env above. There is no path
  # by which the frontend can ship a different commit than the backend.
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      # nginx serves frontend/dist/ as static files -- there is no process to
      # restart, which is exactly why this was missed before: a push here
      # updated GitHub but nothing on the VM ever rebuilt it, and there was no
      # workflow run, log, or red X to notice by. This calls the committed
      # deploy script so a CI run and a manual run on the box do the same
      # thing, and the script itself proves the public URL served the new
      # build before exiting 0 -- see frontend/scripts/deploy.sh for why that
      # check exists rather than trusting a clean `npm run build`.
      #
      # Reuses the same GCP_VM_HOST / GCP_VM_USER / GCP_VM_SSH_KEY secrets as
      # deploy.yml (the backend workflow) -- same VM, same repo.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          # Carries DEPLOY_SHA into the remote shell as a value. If this ever
          # failed to arrive, the deploy script's mandatory-SHA check fails the
          # release -- it never falls back to origin/main.
          envs: DEPLOY_SHA
          command_timeout: 10m
          script: |
            set -e
            bash /var/www/zoiko-meds-platform/frontend/scripts/deploy.sh "$DEPLOY_SHA"
