# ZoikoMeds Backend — local Docker stack (API + PostgreSQL)
# Usage:
#   docker compose up --build
# The API will be available at http://localhost:4000/api

services:
  db:
    image: postgres:16-alpine
    container_name: zoikomeds-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zoikomeds
    ports:
      - "5432:5432"
    volumes:
      - zoikomeds-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoikomeds"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoikomeds-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Secrets (JWT_SECRET, SUPER_ADMIN_PASSWORD, SMTP_PASSWORD, API keys) are
    # sourced from .env — NEVER hardcode them here (this file is committed).
    # Compose fails fast via ${VAR:?message} if a required secret is missing.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
      API_PREFIX: api
      CORS_ORIGIN: https://zoiko-meds-platform.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://localhost:8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zoikomeds?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: 3600s
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      EXPOSE_EXACT_STOCK: "false"
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@zoikomeds.io}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set in .env}
      SUPER_ADMIN_NAME: ZoikoMeds Super Admin
    ports:
      - "8000:8000"

volumes:
  zoikomeds-db-data:
