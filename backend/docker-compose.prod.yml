services:
  db:
    ports: !override
      - "127.0.0.1:5432:5432"
  api:
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      CORS_ORIGIN: https://zoikomeds.com,https://www.zoikomeds.com,https://app.zoikomeds.com
      # Android app (see src/config/mobile-app.ts): its WebView origin, and the
      # app-scheme return for Google sign-in.
      MOBILE_APP_ORIGINS: https://localhost
      MOBILE_OAUTH_REDIRECT: com.zoikomeds.app://auth/callback
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zoikomeds-pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@zoikomeds.com}
      # Supplied by the VM's backend/.env, never by this file. The literal that
      # used to sit here was a working database-admin password committed in plain
      # text, and it remains readable in this file's git history — so it has to be
      # rotated, not merely moved.
      #
      # `:?` rather than a default on purpose: pgAdmin fronts the production
      # database, so a missing value must stop the stack with a named error rather
      # than quietly starting one with a blank or guessable login.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in backend/.env on the VM}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - zoikomeds-pgadmin-data:/var/lib/pgadmin

volumes:
  zoikomeds-pgadmin-data:
