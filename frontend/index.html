<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ZoikoMeds — governed enterprise intelligence across medicine availability, shortage pressure, and access risk."
    />
    <meta name="theme-color" content="#0F172A" />
    <title>ZoikoMeds · Medicine Availability Intelligence</title>

    <!-- Default Open Graph / Twitter tags. Per-route <Seo> overrides these at runtime. -->
    <meta property="og:site_name" content="ZoikoMeds" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZoikoMeds · Medicine Availability Intelligence" />
    <meta
      property="og:description"
      content="Governed medicine availability intelligence — confidence signals from verified pharmacies, never exact stock."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZoikoMeds · Medicine Availability Intelligence" />
    <script>
      // Apply persisted theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('zoiko-theme')
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored ? stored === 'dark' : systemDark
          var root = document.documentElement
          root.classList.remove('light', 'dark')
          root.classList.add(isDark ? 'dark' : 'light')
        } catch (e) {}
      })()

      // Apply saved accessibility preferences before paint too, so larger text
      // does not reflow the page a moment after it has been read. Mirrors
      // src/lib/a11y-preferences.js — change both together.
      ;(function () {
        try {
          var raw = localStorage.getItem('zoiko-a11y')
          var prefs = raw ? JSON.parse(raw) : null
          var reduceDefault = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          var root = document.documentElement
          root.classList.toggle('a11y-large-text', !!(prefs && prefs.largeText))
          root.classList.toggle(
            'a11y-reduce-motion',
            prefs ? !!prefs.reduceMotion : reduceDefault
          )
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
