<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ZoikoMeds — governed enterprise intelligence across medicine availability, shortage pressure, and access risk."
    />
    <meta name="theme-color" content="#0F172A" />
    <title>ZoikoMeds · Medicine Availability Intelligence</title>
    <script>
      // Apply persisted theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('zoiko-theme')
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored ? stored === 'dark' : systemDark
          var root = document.documentElement
          root.classList.remove('light', 'dark')
          root.classList.add(isDark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
