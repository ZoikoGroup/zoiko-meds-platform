# ZoikoMeds — local development stack (Postgres + NestJS backend + Vite frontend)
# Usage:
#   docker compose -f docker-compose.developement.yml up --build
# Frontend: http://localhost:5173
# Backend:  http://localhost:4000/api

services:
  db:
    image: postgres:16-alpine
    container_name: zoikomeds-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zoikomeds
    ports:
      - "5432:5432"
    volumes:
      - zoikomeds-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoikomeds"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    container_name: zoikomeds-dev-backend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      API_PREFIX: api
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zoikomeds?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 3600s
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      EXPOSE_EXACT_STOCK: "false"
      # Seeded on every startup (idempotent). Change before any real use.
      SUPER_ADMIN_EMAIL: superadmin@zoikomeds.io
      SUPER_ADMIN_PASSWORD: ChangeMe!SuperAdmin1
      SUPER_ADMIN_NAME: ZoikoMeds Super Admin
      # Links in outbound email point here.
      APP_BASE_URL: http://localhost:5173
      # SMTP credentials are intentionally NOT set here (no secrets committed).
      # They are read from the mounted backend/.env (ConfigModule). If that file
      # has no SMTP_HOST, the backend falls back to a log-only mailer and prints
      # emails (including reset links) to this container's log.
    volumes:
      - ./backend:/app
      - zoikomeds-dev-backend-node-modules:/app/node_modules
    ports:
      - "4000:4000"
    command: sh -c "apk add --no-cache openssl libc6-compat && npm ci && npx prisma generate && npx prisma db push --skip-generate && npx prisma db seed && npm run start:dev"

  frontend:
    image: node:22-alpine
    container_name: zoikomeds-dev-frontend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
      VITE_APP_NAME: ZoikoMeds
      VITE_APP_ENV: development
      VITE_ENABLE_MOCK_DATA: "true"
    volumes:
      - ./frontend:/app
      - zoikomeds-dev-frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  zoikomeds-dev-db-data:
  zoikomeds-dev-backend-node-modules:
  zoikomeds-dev-frontend-node-modules:
